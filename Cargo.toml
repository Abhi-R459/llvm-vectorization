[package]
name = "rust-loop-vectorizer"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A correctness-first educational LLVM loop-vectorization pass implemented in Rust"
license = "Apache-2.0 WITH LLVM-exception"
repository = "https://github.com/Passive-Coder/llvm-vectorization"
publish = false
build = "build.rs"

[lib]
name = "rust_loop_vectorizer"
crate-type = ["cdylib", "rlib"]

[dependencies]
llvm-sys = { version = "=211.0.0", features = ["no-llvm-linking"] }

[build-dependencies]
cc = "1.2"

[profile.release]
lto = "thin"
codegen-units = 1

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = "warn"
pedantic = "warn"
